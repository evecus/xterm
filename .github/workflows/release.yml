name: Release APK

# 推送 v* 标签时自动构建并发布 Release；也可在 Actions 页面手动触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 为空时跳过签名，产出 unsigned APK；配置 Secrets 后自动签名
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || '' }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '' }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || '' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/app/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK (arm64-v8a, R8 minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Show APK info
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*arm64*.apk)
          $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs "$APK" || echo "unsigned APK (未配置签名 Secrets)"

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*arm64*.apk)
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp "$APK" SSH-Term-${VERSION}-arm64-release.apk
          MAPPING=$(find app/build/outputs -name "mapping.txt" | head -1)
          [ -n "$MAPPING" ] && cp "$MAPPING" SSH-Term-mapping-${VERSION}.txt || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshterm-release
          path: |
            SSH-Term-*-arm64-release.apk
            SSH-Term-mapping-*.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SSH-Term-*-arm64-release.apk
            SSH-Term-mapping-*.txt
          generate_release_notes: true
