name: Release APK

# 推送 v* 标签时自动构建并发布 Release；也可在 Actions 页面手动触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 为空时跳过签名，产出 unsigned APK；配置 Secrets 后自动签名
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || '' }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '' }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || '' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 本机终端 / proot 用到了 NDK JNI 库（app/src/main/cpp/pty.c），
      # 需要 NDK 与 CMake 3.22.1；镜像通常已预装，缺失时补装。
      - name: Ensure NDK and CMake
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "ndk;27.0.12077973" "cmake;3.22.1" || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/app/release.keystore" >> "$GITHUB_ENV"

      # proot 二进制不进仓库（Aurora 亦如此）。构建成功则 Linux 终端可用；
      # 失败不阻断 APK 产出，运行时会提示缺少 libproot.so。
      # 脚本默认输出到 Flutter 的 android/app/... 路径，本工程是原生 Android
      # 结构，必须用 PROOT_OUT_DIR 覆盖到 app/src/main/jniLibs/arm64-v8a。
      - name: Build proot (optional)
        continue-on-error: true
        env:
          PROOT_OUT_DIR: ${{ github.workspace }}/app/src/main/jniLibs/arm64-v8a
          PROOT_BUILD_DIR: ${{ github.workspace }}/build/proot-android
        run: |
          chmod +x scripts/build-proot-android.sh
          ./scripts/build-proot-android.sh

      - name: Build release APK (arm64-v8a, R8 minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*arm64*.apk)
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp "$APK" xterm-${VERSION}-arm64-release.apk
          MAPPING=$(find app/build/outputs -name "mapping.txt" | head -1)
          [ -n "$MAPPING" ] && cp "$MAPPING" xterm-mapping-${VERSION}.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: |
            xterm-*-arm64-release.apk
